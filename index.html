<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-title" content="NFS line">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070B16;--s1:#0E1424;--s2:#151C32;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);--text:#ECEFF7;--mut:#8A93AB;--brass:#D2A85C;--brass2:#EBCF94;--ok:#6FD0A4;--f:'KahrobaN','Vazirmatn',system-ui,sans-serif;--k:'Kahroba','KahrobaN','Vazirmatn',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--f);color:var(--text);min-height:100vh;padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;
background:radial-gradient(100% 38% at 50% -6%,rgba(60,90,200,.20),transparent 70%),radial-gradient(70% 30% at 100% 100%,rgba(210,168,92,.07),transparent 70%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.page{display:none;max-width:520px;margin:auto;padding:22px 18px calc(78px + env(safe-area-inset-bottom,0px))}
.page.on{display:block;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-left:6px}
.hi{font-family:var(--k);font-size:1.9rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.date{color:var(--mut);font-size:.9rem;margin-top:2px}
.meta{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.streak{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line2);border-radius:10px;font-size:.78rem;font-weight:600;color:var(--brass2);background:var(--s1)}
.streak svg{width:14px;height:14px;fill:var(--brass)}
.cap{color:var(--mut);font-size:.76rem}
.dial{position:relative;flex:none;width:112px;aspect-ratio:1}
.dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial .c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.dial .big{font-size:1.45rem;font-weight:300;letter-spacing:-.02em}
.tk{stroke:rgba(255,255,255,.16);stroke-width:5;stroke-linecap:round;transition:stroke .3s}
.tk.on{stroke:var(--brass)}.tk.m{stroke-width:7}
/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:20px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.68rem;color:var(--mut)}
.wd .bar{position:relative;width:100%;height:34px;border-radius:9px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.wd .bar i{position:absolute;inset:auto 0 0 0;background:linear-gradient(0deg,var(--brass),var(--brass2));opacity:.9;transition:height .4s}
.wd.td{color:var(--brass2);font-weight:700}.wd.td .bar{border-color:var(--brass)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px}
.tile{position:relative;min-width:0;padding:8px 9px 9px;border-radius:11px;background:var(--s1);border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;row-gap:0;align-items:center;text-align:right;transition:.2s}
.tile svg{grid-row:1/3;width:17px;height:17px;stroke:var(--ac);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:.64rem;font-weight:700;line-height:1.25;display:block}
.tile b br{display:none}
.tile em{font-style:normal;font-size:.6rem;color:var(--mut)}
.tile i{position:absolute;inset:auto 0 0 0;height:2px;border-radius:0 0 11px 11px;background:var(--line);overflow:hidden}
.tile i u{display:block;height:100%;float:right;background:var(--ac);transition:width .4s}
.tile.full em{color:var(--ok)}
.tile.on{background:var(--s2);border-color:var(--ac);box-shadow:0 10px 30px -14px var(--ac)}
/* panel */
.panel{margin-top:14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.ph{position:relative;display:flex;align-items:center;justify-content:space-between;padding:20px 22px 18px;background:linear-gradient(270deg,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%);border-bottom:1px solid var(--line)}
.ph::before{content:"";position:absolute;right:0;top:18px;bottom:18px;width:3px;border-radius:3px 0 0 3px;background:var(--ac)}
.panel.cel .ph{animation:cel 1s ease}
@keyframes cel{30%{background:linear-gradient(270deg,color-mix(in srgb,var(--ac) 45%,transparent),transparent 90%)}}
.ph h2{font-family:var(--k);font-size:1.45rem;font-weight:700}
.ph p{font-size:.8rem;color:var(--mut);margin-top:3px}
.ed{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--mut);border:1px solid var(--line)}
.ed svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ed.on{color:var(--brass2);border-color:var(--brass);background:rgba(210,168,92,.1)}
.trow{display:flex;align-items:stretch}
.task{display:flex;align-items:center;gap:15px;flex:1;min-width:0;text-align:right;padding:16px 22px;font-size:1rem;font-weight:500;transition:background .2s}
.task:active{background:var(--s2)}
.task .t{min-width:0}

:root{--bg:#081020;--s1:rgba(16,23,42,.92);--s2:rgba(27,36,62,.95);--brass:#D8B070;--aur1:rgba(72,196,176,.13);--aur2:rgba(112,124,236,.15);--aur3:rgba(216,176,112,.08)}

.amb i{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform;transition:background 4s ease}
.amb .a1{width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;background:radial-gradient(circle,var(--aur1),transparent 65%);animation:dA 38s ease-in-out infinite alternate}
.amb .a2{width:80vmax;height:80vmax;right:-35vmax;top:10vh;background:radial-gradient(circle,var(--aur2),transparent 65%);animation:dB 46s ease-in-out infinite alternate}
.amb .a3{width:60vmax;height:60vmax;left:-10vmax;bottom:-30vmax;background:radial-gradient(circle,var(--aur3),transparent 65%);animation:dC 52s ease-in-out infinite alternate}
@keyframes dA{to{transform:translate3d(18vmax,14vmax,0) scale(1.15)}}
@keyframes dB{to{transform:translate3d(-20vmax,-8vmax,0) scale(1.1)}}
@keyframes dC{to{transform:translate3d(16vmax,-12vmax,0) scale(1.2)}}
.amb b{position:absolute;bottom:-12px;width:var(--sz);height:var(--sz);border-radius:50%;background:radial-gradient(circle,rgba(255,240,205,.9),rgba(255,240,205,0) 70%);opacity:0;animation:rise var(--du) linear var(--de) infinite}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.5}70%{opacity:.35}100%{transform:translate3d(var(--dx),-108vh,0);opacity:0}}
.page,.toast{position:relative;z-index:1}.toast{position:fixed}
.page.on{animation:in .7s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
.panel,.tile,.info div,.card,.rvb,.streak,.wd .bar,.cal{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.panel,.info div,.card,.tile{border-color:rgba(255,255,255,.09);box-shadow:0 14px 40px -26px rgba(0,0,0,.7)}
.tile,.task,.dock button,.ed,.rvb{transition:background .35s ease,border-color .35s ease,transform .25s ease,box-shadow .5s ease}
.tile:active,.rvb:active{transform:scale(.97)}
.tile.on{animation:breath 5.5s ease-in-out infinite}
@keyframes breath{50%{box-shadow:0 14px 42px -10px var(--ac)}}
.streak svg{animation:ember 3.2s ease-in-out infinite}
@keyframes ember{50%{transform:scale(1.18);filter:drop-shadow(0 0 5px var(--brass))}}
.stage{border-color:rgba(160,205,255,.16);animation:stg 7s ease-in-out infinite}

.task.done .bx{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
html{scroll-behavior:smooth}

/* ===== refined section cards ===== */
.panel{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 7%,rgba(18,26,48,.96)),rgba(14,20,38,.96) 45%);border:1px solid color-mix(in srgb,var(--ac) 26%,rgba(255,255,255,.07));box-shadow:0 18px 44px -24px color-mix(in srgb,var(--ac) 55%,#000),inset 0 1px 0 rgba(255,255,255,.06)}

<script>
(function(){
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(11),f=n=>n.toFixed(1),rg=(a,b)=>a+R()*(b-a);
function rp(p,r){const n=p.length;let d='';for(let i=0;i<n;i++){const a=p[(i+n-1)%n],b=p[i],c=p[(i+1)%n];
 const l1=Math.hypot(a[0]-b[0],a[1]-b[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]),k=Math.min(r,l1/2,l2/2);
 const p1=[b[0]+(a[0]-b[0])/l1*k,b[1]+(a[1]-b[1])/l1*k],p2=[b[0]+(c[0]-b[0])/l2*k,b[1]+(c[1]-b[1])/l2*k];
 d+=(i?'L':'M')+f(p1[0])+' '+f(p1[1])+'Q'+f(b[0])+' '+f(b[1])+' '+f(p2[0])+' '+f(p2[1])}return d+'Z'}
const mix=(a,b,t)=>'#'+[0,1,2].map(i=>Math.round(parseInt(a.substr(1+2*i,2),16)*(1-t)+parseInt(b.substr(1+2*i,2),16)*t).toString(16).padStart(2,'0')).join('');

function slab(pts,r,d,top,bot,gid){let s='';
 for(let k=d;k>=0;k-=2)s+=`<path d="${rp(shift(pts,k),r)}" fill="${mix(top,bot,k/d)}"/>`;
 s+=`<path d="${rp(pts,r)}" fill="url(#${gid})" stroke="#fff" stroke-opacity=".9" stroke-width="2"/><path d="${rp(pts,r)}" fill="url(#sh)"/>`;return s}

 let o=`<g clip-path="url(#fc)"><ellipse cx="${x}" cy="${f(y+ry*.35)}" rx="${f(rx*1.1)}" ry="${f(ry*.55)}" fill="#010c08" opacity=".65"/></g>`;const q=[];
 for(let k=0;k<n*1.6;k++){const a=R()*Math.PI*2,d=Math.pow(R(),.65),px=x+Math.cos(a)*d*rx,by=y+Math.sin(a)*d*ry*.45,
  lift=Math.pow(1-d*d,.7)*ry*hs*(.5+R()*.5);q.push([px,by,lift,d,rg(2,4.4)*(rx/50)*(.85+.3*(1-d))])}
 q.sort((a,b)=>a[1]-b[1]);
 for(const[px,by,lift,d,r]of q){const t=lift/(ry*hs);const L=12+t*40+rg(0,10)-d*4;
  o+=`<circle cx="${f(px)}" cy="${f(by-lift)}" r="${f(r)}" fill="hsl(${f(rg(110,145))} ${f(rg(55,80))}% ${f(Math.min(60,L))}%)"/>`}
 for(let k=0;k<n/5;k++){const a=R()*Math.PI*2,d=Math.sqrt(R())*.75,px=x+Math.cos(a)*d*rx,by=y+Math.sin(a)*d*ry*.45,lift=Math.pow(1-d*d,.7)*ry*hs;
  o+=`<circle cx="${f(px)}" cy="${f(by-lift-1)}" r="${f(rg(.6,1.4))}" fill="hsl(${f(rg(85,125))} 80% ${f(rg(66,80))}%)" opacity=".9"/>`}
 for(let k=0;k<Math.round(rx*.8);k++){const sx=(R()-.5)*2,l=rg(7,17)*(rx/50),bx=x+(R()-.5)*rx*1.8,by=y+(R()-.35)*ry*.4;

 return o}

function tree(){const H=400,T=-440;

 if(a.jt>0)a.jt=Math.max(0,a.jt-dt);

 sa(a.lL,`translate(-7 -34) rotate(${f(sw*26*a.wk)})`);sa(a.lR,`translate(7 -34) rotate(${f(-sw*26*a.wk)})`);
 sa(a.aL,`translate(-16 -63) rotate(${f(a.cL)})`);sa(a.aR,`translate(16 -63) rotate(${f(-a.cR)})`);
 sa(a.hd,`translate(0 -88) rotate(${f(a.tilt+Math.sin(T*1.3+a.seed)*1.5)} 0 18)`);
 a.blink-=dt;if(a.blink<0){a.be=.1;if(a.blink<-.12){a.blink=rnd(2.5,5);a.be=1}}

 if(a.shr){a.shr.setAttribute('opacity',P.shears?1:0);const o=8+Math.abs(Math.sin(T*10))*16;sa(a.b1,`rotate(${f(o)})`);sa(a.b2,`rotate(${f(-o)})`)}

  if(p.gnd!=null&&p.y>=p.gnd){p.y=p.gnd;p.vx=p.vy=p.ay=p.vr=0;p.life=Math.min(p.life,.25)}
  if(p.life<=0){p.el.remove();parts.splice(i,1);continue}
  p.el.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${p.rot.toFixed(0)})`);
  p.el.setAttribute('opacity',Math.min(1,p.life*2.5).toFixed(2));
 }
}

const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;
const mixc=(c1,c2,t)=>{const A=[1,3,5].map(i=>parseInt(c1.substr(i,2),16)),B=[1,3,5].map(i=>parseInt(c2.substr(i,2),16));return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('')};
const FL=[[-82,6,'#ff7aa2'],[-72,10,'#ffd166'],[-62,5,'#ff9bd0'],[-52,11,'#fff'],[-90,12,'#ffd166'],[56,9,'#ff7aa2'],[66,5,'#ffd166'],[76,11,'#ff9bd0'],[86,6,'#fff'],[96,12,'#ff7aa2'],[-100,7,'#fff'],[104,8,'#ffd166']];

 const wall=mixc('#b98d5c','#f6dfb6',e),trim=mixc('#8a6a45','#ffffff',e),roofC=mixc('#8f4a38','#c2563f',r);

 if(p<.12)for(const x of[-62,62])o+=`<path d="M${x} 4V-14" stroke="#c9a06b" stroke-width="3"/>`+(x>0?`<path d="M-62 -10H62" stroke="#f4e3a1" stroke-width="1" stroke-dasharray="3 2"/>`:'');
 if(f>0)o+=`<rect x="-62" y="${-9*f}" width="124" height="${9*f}" rx="2" fill="#8b94a3"/><rect x="-62" y="${-9*f}" width="124" height="2" fill="#aab3c2"/>`;
 if(p>.1&&p<.62){const ph=-9-64*Math.max(w,.25);o+=`<path d="M72 4V${ph}M98 4V${ph}" stroke="#a98458" stroke-width="3"/>`;if(w>.3)o+=`<rect x="68" y="-34" width="34" height="3" fill="#c9a06b"/>`;if(w>.7)o+=`<rect x="68" y="-58" width="34" height="3" fill="#c9a06b"/>`}
 if(p<.55)for(let i=0;i<3;i++)o+=`<rect x="${-104+i*2}" y="${-4-i*5}" width="${36-i*3}" height="4.5" rx="1" fill="#c9a06b"/>`;
 if(w>0){const H=64*w;
  o+=`<rect x="-56" y="${-9-H}" width="112" height="${H}" fill="${wall}"/>`;
  for(let y=-17;y>-9-H;y-=8)o+=`<path d="M-56 ${y}H56" stroke="#000" stroke-opacity=".12"/>`;
  if(e<.3)for(const x of[-56,-28,0,28,56])o+=`<rect x="${x-2}" y="${-9-H}" width="4" height="${H}" fill="${trim}" opacity=".85"/>`;
  o+=`<rect x="-58" y="${-11-H}" width="116" height="3" fill="${trim}"/>`}
 if(d>.3&&r>.5)o+=`<rect x="30" y="-112" width="11" height="34" fill="#9b7561"/><rect x="28" y="-114" width="15" height="4" fill="#7b5a49"/>`;
 if(r>0){let t='';for(let k=1;k<6;k++){const y=-k*9,hw=72*(1+y/56);t+=`<path d="M${-hw} ${y}H${hw}" stroke="#000" stroke-opacity=".18"/>`}
  o+=`<g transform="translate(0 -73) scale(1 ${r.toFixed(3)})"><path d="M-72 0L0 -56L72 0Z" fill="${roofC}"/>${t}<path d="M-72 0L0 -56L72 0" fill="none" stroke="${trim}" stroke-width="3" stroke-linejoin="round"/></g>`}
 if(d>0){const dh=38*cl(d*2);o+=`<rect x="12" y="${-9-dh}" width="22" height="${dh}" rx="3" fill="#7b4b2a"/>`;if(dh>30)o+=`<circle cx="29.5" cy="-27" r="1.6" fill="#f2c94c"/><path d="M23 -47V-9" stroke="#000" stroke-opacity=".15"/>`;o+=`<rect x="8" y="0" width="32" height="5" rx="1.5" fill="#9aa3b2"/>`}
 if(d>.35)o+=`<rect x="-42" y="-52" width="26" height="24" rx="2" fill="#8fc7ee"/><rect x="-42" y="-52" width="26" height="24" rx="2" fill="none" stroke="${trim}" stroke-width="2.4"/><path d="M-29 -52V-28M-42 -40H-16" stroke="${trim}" stroke-width="1.6"/>`;
 if(d>.7&&r>.8)o+=`<circle cx="0" cy="-92" r="6" fill="#8fc7ee" stroke="${trim}" stroke-width="2"/>`;
 if(e>.4)o+=`<rect x="-45" y="-27" width="32" height="6" rx="1.5" fill="#7a4a2a"/>`+[-40,-32,-24,-16].map((x,i)=>`<circle cx="${x}" cy="-29" r="2.4" fill="${['#ff7aa2','#ffd166','#ff9bd0','#fff'][i]}"/>`).join('');
 if(e>.35){for(let x=-100;x<=-66;x+=8)o+=`<rect x="${x}" y="-4" width="4" height="16" fill="#fff"/>`;for(let x=70;x<=102;x+=8)o+=`<rect x="${x}" y="-4" width="4" height="16" fill="#fff"/>`;o+=`<path d="M-100 2H-64M70 2H104" stroke="#e7edf7" stroke-width="2"/>`}
 if(e>.55)o+=`<ellipse cx="22" cy="12" rx="8" ry="3" fill="#aab3c2"/><ellipse cx="18" cy="19" rx="8" ry="3" fill="#aab3c2"/><ellipse cx="24" cy="27" rx="9" ry="3" fill="#aab3c2"/>`;
 if(e>.5)o+=`<path d="M44 -44V-36" stroke="#555" stroke-width="1.5"/><rect x="41" y="-36" width="6" height="8" rx="2" fill="#f2c94c"/>`;
 for(let i=0;i<Math.floor(e*FL.length);i++){const[x,y,c]=FL[i];o+=`<path d="M${x} ${y}v-6" stroke="#2f9e5c" stroke-width="1.6"/><circle cx="${x}" cy="${y-8}" r="3.2" fill="${c}"/>`}
 o+='</g>';
 if(p<.62){const op=1-cl((p-.52)/.1);o+=`<g transform="translate(${TNT.x} ${TNT.y})" opacity="${op.toFixed(2)}"><ellipse cy="4" rx="40" ry="8" fill="#000" opacity=".4"/><path d="M-32 0L0 -38L32 0Z" fill="#e8884a"/><path d="M0 -38L32 0H10Z" fill="#c96d34"/><path d="M-9 0L0 -22L9 0Z" fill="#35271b"/><path d="M-32 0L0 -38L32 0" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/></g>`+
  `<g transform="translate(${TNT.x+54} ${TNT.y+8})" opacity="${op.toFixed(2)}"><path d="M-9 4L9 -1M-9 -1L9 4" stroke="#6b4a2a" stroke-width="3.5" stroke-linecap="round"/><ellipse class="fire" cx="0" cy="-5" rx="5" ry="8" fill="#ff9a3c" opacity="0"/><ellipse class="fire2" cx="0" cy="-3" rx="2.5" ry="4.5" fill="#ffe08a" opacity="0"/></g>`}
 houseG.innerHTML=o;
 let g='';
 if(d>.35)g+=`<ellipse class="gl" data-k="w" cx="${HX-29}" cy="${HY-40}" rx="36" ry="30" fill="#ffcf6b" filter="url(#b4)" opacity="0"/><rect class="gl" data-k="w" x="${HX-41}" y="${HY-51}" width="24" height="22" rx="2" fill="#ffd98a" opacity="0"/>`;
 if(e>.5)g+=`<ellipse class="gl" data-k="l" cx="${HX+44}" cy="${HY-32}" rx="16" ry="16" fill="#ffd27a" filter="url(#b4)" opacity="0"/>`;
 if(p<.62)g+=`<ellipse class="gl" data-k="t" cx="${TNT.x}" cy="${TNT.y-14}" rx="36" ry="26" fill="#ffb35a" filter="url(#b4)" opacity="0"/><ellipse class="gl" data-k="f" cx="${TNT.x+54}" cy="${TNT.y+2}" rx="40" ry="24" fill="#ff9a3c" filter="url(#b4)" opacity="0"/>`;
 glowG.innerHTML=g;
}
let lastP=-1,lastN=-1,nowN=0,smokeT=0;
function nightFx(){
 const n=nightAmt(hrNow()),p=getP();
 if(Math.abs(n-lastN)>.01){lastN=n;
  const fl=n>.02?`brightness(${(1-.4*n).toFixed(2)}) saturate(${(1-.25*n).toFixed(2)})`:'';
  for(const id of['house','aBack','aFront','aDuo','tsway']){const el=$(id);if(el)el.style.filter=fl}
  nightF.setAttribute('opacity',(.4*n).toFixed(2))}
 nowN=n;
}
function lights(){
 const n=nowN,lit=asleep?.4*n:n,fl=.9+.1*Math.sin(T*9)*Math.sin(T*3.3);
 for(const e of glowG.querySelectorAll('.gl')){const k=e.dataset.k;
  e.setAttribute('opacity',(k==='f'?n>.15?.55*fl:0:k==='t'?(asleep?.7:.45)*n:(.85*lit)).toFixed(2))}
 for(const e of houseG.querySelectorAll('.fire,.fire2')){e.setAttribute('opacity',n>.15?1:0);e.setAttribute('ry',(e.classList.contains('fire')?8:4.5)*(.85+.25*Math.sin(T*14+(e.classList.contains('fire2')?2:0))))}
}
function houseTick(dt){
 const p=getP();
 if(Math.abs(p-lastP)>.0004){lastP=p;houseSVG(p)}
 nightFx();lights();
 if(p>=.8&&(nowN>.1||asleep)){smokeT-=dt;if(smokeT<=0){smokeT=.7;mkP(shape('circle',{r:3,fill:'#cfd8e8'}),{x:HX+35,y:HY-116,vx:rnd(3,9),vy:-14,life:2.8,max:2.8})}}
}

 T+=dt;
 const w=waiters;waiters=[];for(const x of w){if(x.t<=T)x.r();else waiters.push(x)}

 step(him,dt);step(her,dt);layers();updParts(dt);houseTick(dt);duo.tick(dt);peek.tick(dt);
 glow=Math.max(0,glow-dt*.35);shake=Math.max(0,shake-dt*.5);

 if(tgl)tgl.setAttribute('opacity',(glow*(.55+.25*Math.sin(T*6))).toFixed(2));
}

step(him,.016);step(her,.016);layers();houseTick(.016);duo.tick(.016);peek.tick(.016);
